# Domains that are SUSPICIOUS regardless of above
# (patterns in domain or path that indicate phishing even on otherwise-known domains)
suspicious_url_patterns:
  - ".*-login\\..*"
  - ".*-verify\\..*"
  - ".*-secure\\..*"
  - ".*account-update.*"
  - ".*signin-.*"
  - ".*verify-account.*"

# Words in URL path that indicate suspicious intent
suspicious_path_words:
  - login
  - verify
  - secure
  - update
  - confirm
  - account
  - banking
  - otp
  - signin
  - auth
  - wallet
  - payment
  - password
  - credential

# APG Risk Intelligence Engine v1 — Trusted Domain Allowlist
#
# IMPORTANT: Being on this list reduces LOCAL suspicion heuristics only.
# It does NOT neutralize credential requests, OTP theft, or other block
# evidence. A message asking for a password from a "trusted" domain is
# still dangerous.


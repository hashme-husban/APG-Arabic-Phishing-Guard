# Words that NEGATE an action verb (must check within short window before verb)
negation_words:
  - "لا"
  - "لن"
  - "لم"
  - "ما"
  - "ممنوع"
  - "محذور"
  - "احذر"
  - "لا تقم"
  - "لا تشارك"
  - "لا تفصح"
  - "لا تعط"
  - "لا تعطي"
  - "لا ترسل"
  - "لا تدخل"
  - "لا تضغط"
  - "لن يطلب"
  - "ما ترسل"
  - "do not"
  - "don't"
  - "never"
  - "never share"
  - "do not share"

# Indicators that the message is about SECURITY AWARENESS (not a request)
awareness_indicators:
  - "لا تشاركه"
  - "لا تشارك الرمز"
  - "لا تفصح"
  - "لا تعطه"
  - "لا تعطيه لأحد"
  - "لا ترسل الرمز"
  - "لا تزود أحدا"
  - "لن يطلب البنك"
  - "البنك لن يطلب"
  - "لا يطلب البنك"
  - "لا نطلب منك"
  - "لن نطلب منك"
  - "احذر من الروابط"
  - "احذر من رسائل"
  - "رسالة توعوية"
  - "نصيحة أمنية"
  - "لحماية حسابك"
  - "تحذير أمني"
  - "do not share"
  - "never share"
  - "do not disclose"
  - "bank will never ask"
  - "we will never ask"
  - "we never ask"

# Patterns indicating safe OTP delivery (code given WITH do-not-share warning)
otp_delivery_indicators:
  - "رمز التحقق الخاص بك هو"
  - "رمز التحقق الخاص بك:"
  - "رمز الدخول لمرة واحدة"
  - "كود التحقق الخاص بك"
  - "رمزك هو"
  - "your otp is"
  - "your verification code is"
  - "your otp:"
  - "your code is"
  - "رمز واتساب:"
  - "كود واتساب:"

# App/service verification status (not a credential request)
app_verification_indicators:
  - "جاري التحقق من واتساب"
  - "تم التحقق من واتساب"
  - "واتساب جاري التحقق"
  - "واتساب يتحقق"
  - "يتحقق من رقم الهاتف"
  - "whatsapp verification in progress"
  - "whatsapp verifying"
  - "whatsapp is verifying"
  - "telegram is verifying"
  - "تيليغرام جاري التحقق"
  - "تحقق تيليغرام"


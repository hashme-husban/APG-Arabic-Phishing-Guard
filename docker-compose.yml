services:
  ocr_service:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "9000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apg}
      POSTGRES_USER: ${POSTGRES_USER:-apg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apg_user} -d ${POSTGRES_DB:-apg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://apg_user:change-this-postgres-password@db:5432/apg}
      EXPORT_DIR: /app/exports
      PDF_EXPORT_DIR: /app/exports/pdf
      OCR_PADDLE_SERVICE_URL: http://ocr_service:9000/ocr
      OCR_ENGINE: ${OCR_ENGINE:-auto}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_exports:/app/exports
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-APG Admin Console}
        VITE_ENABLE_DEMO_MODE: ${VITE_ENABLE_DEMO_MODE:-false}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
  backend_exports:
